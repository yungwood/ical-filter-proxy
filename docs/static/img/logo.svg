      <rect x="344" y="458" width="88" height="89" rx="18"/>
      <rect x="472" y="458" width="88" height="89" rx="18"/>
      <rect x="600" y="458" width="88" height="89" rx="18"/>
      <rect x="89" y="586" width="88" height="89" rx="18"/>
      <rect x="344" y="586" width="88" height="89" rx="18"/>
      <rect x="472" y="586" width="88" height="89" rx="18"/>
      <rect x="600" y="586" width="88" height="89" rx="18"/>
    </g>

    <rect x="216" y="586" width="88" height="89" rx="18" fill="url(#changedEvent)"/>
    <g fill="#fff8df" opacity="0.92">
      <rect x="239" y="617" width="42" height="9"/>
      <rect x="239" y="636" width="31" height="9"/>
    </g>

