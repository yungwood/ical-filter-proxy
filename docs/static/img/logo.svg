    <rect x="600" y="458" width="88" height="89" rx="18" fill="url(#removedEvent)" opacity="0.68"/>
    <path d="M619 527l50-50" stroke="#b4232d" stroke-width="13" stroke-linecap="round" opacity="0.9"/>

    <rect x="472" y="586" width="88" height="89" rx="18" fill="url(#removedEvent)" opacity="0.68"/>
    <path d="M491 655l50-50" stroke="#b4232d" stroke-width="13" stroke-linecap="round" opacity="0.9"/>
