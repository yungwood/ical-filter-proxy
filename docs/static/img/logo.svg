<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 777 777" role="img" aria-labelledby="title desc">
  <title id="title">iCal Filter Proxy</title>
  <desc id="desc">A calendar icon with a filter funnel over the date grid.</desc>
  <defs>
    <linearGradient id="calendarBody" x1="92" y1="252" x2="665" y2="720" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fbfaf6"/>
      <stop offset="1" stop-color="#ece9df"/>
    </linearGradient>
    <linearGradient id="editMark" x1="242" y1="646" x2="292" y2="596" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff8df"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="calendarHeader" x1="42" y1="92" x2="734" y2="254" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e5484d"/>
      <stop offset="1" stop-color="#c8212c"/>
    </linearGradient>
    <linearGradient id="binding" x1="196" y1="8" x2="196" y2="188" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d7dde4"/>
      <stop offset="1" stop-color="#8f9aa7"/>
    </linearGradient>
    <linearGradient id="funnel" x1="236" y1="197" x2="525" y2="489" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="changedEvent" x1="216" y1="588" x2="304" y2="675" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e8bf63"/>
      <stop offset="1" stop-color="#d8952f"/>
    </linearGradient>
    <linearGradient id="removedEvent" x1="472" y1="588" x2="560" y2="675" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#eeeae2"/>
      <stop offset="1" stop-color="#ded9d0"/>
    </linearGradient>
    <filter id="softShadow" x="-12%" y="-12%" width="124%" height="128%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#09111a" flood-opacity="0.18"/>
    </filter>
    <filter id="funnelShadow" x="-16%" y="-16%" width="132%" height="132%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#09111a" flood-opacity="0.36"/>
    </filter>
  </defs>

