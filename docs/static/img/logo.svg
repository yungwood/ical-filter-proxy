  <path filter="url(#funnelShadow)" fill="url(#funnel)" d="M282 108h213c5 0 9 3 11 8 2 4 1 9-3 13l-82 88v102c0 4-2 7-6 9l-43 21c-3 2-7 1-10-1-3-2-5-5-5-9V217l-98-88c-4-4-5-9-3-13 2-5 6-8 26-8z"/>
