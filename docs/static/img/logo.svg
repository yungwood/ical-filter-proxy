    <path fill="url(#calendarBody)" d="M26 270h725v391c0 50-40 90-90 90H116c-50 0-90-40-90-90V270z"/>

    <circle cx="197" cy="169" r="40" fill="#7f111b" opacity="0.62"/>
    <circle cx="580" cy="169" r="40" fill="#7f111b" opacity="0.62"/>
    <rect x="166" y="8" width="62" height="190" rx="29" fill="url(#binding)"/>
