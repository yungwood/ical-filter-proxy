name: nix

on:
  push:
    branches:
      - "*"
    paths:
      - ".github/workflows/nix.yml"
      - "flake.lock"
      - "flake.nix"
      - "go.mod"
      - "go.sum"
      - "service.nix"
      - "*.go"
  pull_request:
    paths:
      - ".github/workflows/nix.yml"
      - "flake.lock"
      - "flake.nix"
      - "go.mod"
      - "go.sum"
      - "service.nix"
      - "*.go"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flake-check:
    name: flake check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Check flake
        run: nix flake check --print-build-logs
